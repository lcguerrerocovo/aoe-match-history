name: Deploy Meilisearch Indexing Job

on:
  push:
    branches: [ master ]
    paths: [ 'jobs/indexing/**', '.github/workflows/deploy-indexing-job.yml' ]
  workflow_dispatch:
    inputs:
      run_job:
        description: 'Run the indexing job after deployment'
        required: false
        default: false
        type: boolean

env:
  PROJECT_ID: aoe2-site
  REGION: us-central1
  IMAGE_NAME: meilisearch-indexer
  JOB_NAME: meilisearch-indexing-job

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker

    - name: Create Artifact Registry repository
      run: |
        if ! gcloud artifacts repositories describe meilisearch --location=$REGION 2>/dev/null; then
          echo "Creating Artifact Registry repository..."
          gcloud artifacts repositories create meilisearch \
            --repository-format=docker \
            --location=$REGION \
            --description="Meilisearch indexing job images"
        else
          echo "Repository already exists"
        fi

    - name: Apply cleanup policy
      run: |
        gcloud artifacts repositories set-cleanup-policies meilisearch \
          --location=$REGION \
          --policy=.github/artifact-registry-cleanup-policy.json \
          --no-dry-run

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker $REGION-docker.pkg.dev

    - name: Build Docker image
      run: |
        cd jobs/indexing
        docker build -f Dockerfile.indexer -t $REGION-docker.pkg.dev/$PROJECT_ID/meilisearch/$IMAGE_NAME:${{ github.sha }} .
        docker tag $REGION-docker.pkg.dev/$PROJECT_ID/meilisearch/$IMAGE_NAME:${{ github.sha }} $REGION-docker.pkg.dev/$PROJECT_ID/meilisearch/$IMAGE_NAME:latest

    - name: Push Docker image
      run: |
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/meilisearch/$IMAGE_NAME:${{ github.sha }}
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/meilisearch/$IMAGE_NAME:latest

    - name: Resolve Meilisearch VM IP
      run: |
        # Phase 2 / issue #40: index DIRECTLY to the prod Meilisearch (non-destructive
        # upsert via add_documents) instead of local-build + snapshot + destructive VM
        # reset/hot-swap. Resolve the aoe-search VM's external IP at deploy time.
        MEILI_IP=$(gcloud compute instances describe aoe-search --zone=us-central1-a --format='get(networkInterfaces[0].accessConfigs[0].natIP)' 2>/dev/null || echo "")
        if [ -z "$MEILI_IP" ]; then
          echo "⚠️  aoe-search VM natIP not found; indexing job will fall back to local-build mode"
        fi
        echo "MEILI_IP=$MEILI_IP" >> $GITHUB_ENV
        echo "Resolved Meilisearch VM IP: $MEILI_IP"

    - name: Deploy Cloud Run Job
      run: |
        # Deploy the Cloud Run Job (create if not exists, update if exists)
        # Phase 2: set MEILISEARCH_HOST/API_KEY so the indexer upserts DIRECTLY to prod
        # (non-destructive). Falls back to local-build mode if MEILI_IP is empty.
        ENV_VARS=""
        if [ -n "$MEILI_IP" ]; then
          ENV_VARS="--set-env-vars=MEILISEARCH_HOST=http://${MEILI_IP}:7700,MEILISEARCH_API_KEY=a-secure-master-key-change-this"
        fi
        if gcloud run jobs describe ${JOB_NAME} --region=${REGION} &>/dev/null; then
          echo "Job exists, updating..."
          gcloud run jobs update ${JOB_NAME} \
            --image=${REGION}-docker.pkg.dev/${PROJECT_ID}/meilisearch/${IMAGE_NAME}:latest \
            --region=${REGION} \
            --memory=4Gi \
            --cpu=2 \
            --max-retries=3 \
            --task-timeout=3600 \
            --service-account=aoe2-site-bot@${PROJECT_ID}.iam.gserviceaccount.com \
            $ENV_VARS
        else
          echo "Job does not exist, creating..."
          gcloud run jobs create ${JOB_NAME} \
            --image=${REGION}-docker.pkg.dev/${PROJECT_ID}/meilisearch/${IMAGE_NAME}:latest \
            --region=${REGION} \
            --memory=4Gi \
            --cpu=2 \
            --max-retries=3 \
            --task-timeout=3600 \
            --service-account=aoe2-site-bot@${PROJECT_ID}.iam.gserviceaccount.com \
            $ENV_VARS
        fi

    - name: Create Cloud Scheduler Job (weekly full reindex)
      run: |
        # The sweep provides total_matches/country/clanlist (from the Relic API
        # leaderboard) which the PG-driven incremental updater can't compute, so it
        # must run periodically. Weekly is enough — those fields change slowly and
        # the full profile-ID sweep is expensive. (Was removed in issue #2 when PG
        # took over incremental name/last_match_date freshness; re-added now that we
        # know total_matches still needs the sweep.) Non-destructive in prod-upsert
        # mode (Phase 2 / issue #40), so a weekly run won't wipe the PG updater's
        # fresher data.
        gcloud scheduler jobs create http meilisearch-indexing-scheduler \
          --schedule="0 0 * * 0" \
          --uri="https://$REGION-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/$PROJECT_ID/jobs/$JOB_NAME:run" \
          --http-method=POST \
          --oauth-service-account-email="$PROJECT_ID@appspot.gserviceaccount.com" \
          --location=$REGION \
          --description="Weekly full Meilisearch reindex (total_matches/country/clanlist)" \
          || echo "Scheduler job already exists or failed to create"

    - name: Run indexing job
      if: ${{ github.event.inputs.run_job == 'true' }}
      run: |
        echo "Running indexing job..."
        gcloud run jobs execute $JOB_NAME --region=$REGION --wait

    - name: Job status
      if: ${{ github.event.inputs.run_job == 'true' }}
      run: |
        echo "Job completed. Check logs for details:"
        echo "gcloud run jobs executions list --job=$JOB_NAME --region=$REGION" 